    cTerms:false,cPrivacy:false,cData:false,cPhysical:false,cRisks:false,cShare:false,cMedia:false,
  }};
  S.view='onboarding'; saveState(); render();
}
const STEP_TITLES=['Información personal','Perfil corporal','Objetivos','Disponibilidad','Historial y limitaciones','Preferencias','Consentimiento'];
function viewOnboarding(){
  const o=S.onboarding; const step=o.step; const d=o.data;
  return `<div style="max-width:680px;margin:0 auto">
    <div class="row spread" style="margin-bottom:16px"><div class="row gap-10"><div class="logo-mark">96</div><div><div style="font-weight:800">${esc(curTrainer().brand.commercial||'Train96')}</div><div class="tiny muted">Registro de alumno</div></div></div>
      <button class="btn ghost sm" onclick="go('s-week')">${icon('x')} Salir</button></div>
    <div class="stepbar">${STEP_TITLES.map((t,i)=>`<div class="sdot ${i<step?'done':i===step?'active':''}"></div>`).join('')}</div>
    <div class="tiny muted" style="margin-bottom:16px">Paso ${step+1} de 7 · ${STEP_TITLES[step]}</div>
    <div class="card pad view-enter" id="obStep">${onboardStep(step,d)}</div>
    <div class="row spread" style="margin-top:16px">
      <button class="btn ghost" onclick="obPrev()" ${step===0?'disabled':''}>${icon('chevL')} Anterior</button>
      ${step<6?`<button class="btn primary" onclick="obNext()">Siguiente ${icon('chevR')}</button>`:`<button class="btn primary" onclick="obFinish()">${icon('check')} Finalizar registro</button>`}
    </div>
  </div>`;
}
function OB(field){ return `S.onboarding.data.${field}`; }
function obInput(label,field,type='text',ph=''){ return `<label class="field">${label}<input type="${type}" value="${esc(S.onboarding.data[field]??'')}" placeholder="${ph}" oninput="${OB(field)}=this.value"></label>`; }
function obSelect(label,field,opts){ return `<label class="field">${label}<select onchange="${OB(field)}=this.value">${opts.map(o=>`<option ${S.onboarding.data[field]===o?'selected':''}>${o}</option>`).join('')}</select></label>`; }
function obChips(field,opts,multi){ return `<div class="row gap-6 wrap">${opts.map(o=>{const arr=S.onboarding.data[field];const on=multi?arr.includes(o):arr===o;return `<button type="button" class="chip ${on?'active':''}" onclick="obToggle('${field}','${o}',${!!multi})">${o}</button>`;}).join('')}</div>`; }
function obToggle(field,val,multi){ const d=S.onboarding.data; if(multi){ const a=d[field]; const i=a.indexOf(val); i>=0?a.splice(i,1):a.push(val); } else d[field]=val; $('#obStep').innerHTML=onboardStep(S.onboarding.step,d); }
function onboardStep(step,d){
  if(step===0) return `<div class="grid g-2 gap-12">
    ${obInput('Nombre','name')}${obInput('Apellidos','lastname')}${obInput('Correo','email','email')}${obInput('Teléfono','phone','tel')}
    ${obInput('Fecha de nacimiento','birth','date')}${obInput('País','country')}</div>
    <label class="field" style="margin-top:12px">Unidad preferida${obChipsUnit()}</label>`;
  if(step===1) return `<div class="grid g-2 gap-12">
    ${obInput('Altura (cm)','height','number')}${obInput('Peso actual ('+d.unit+')','weight','number')}${obInput('Peso objetivo (opcional)','targetWeight','number')}
    ${obSelect('Nivel de experiencia','experience',LEVELS)}${obSelect('Dominancia lateral','dominance',['Diestro','Zurdo','Ambidiestro'])}</div>
    <div class="grid g-2 gap-12" style="margin-top:12px">
      <div class="dropfile" onclick="toast('Fotos añadidas (simulado)')">${icon('camera')}<div class="tiny" style="margin-top:4px">Fotografías (opcional)</div></div>
      <div class="dropfile" onclick="toast('Medidas registradas (simulado)')">${icon('ruler')}<div class="tiny" style="margin-top:4px">Medidas corporales (opcional)</div></div></div>`;
  if(step===2) return `<label class="field" style="margin-bottom:16px">Objetivo principal${obChips('goal',OBJETIVOS,false)}</label>
    <label class="field">Objetivos secundarios (varios)${obChips('goalsSec',OBJETIVOS,true)}</label>`;
  if(step===3) return `<label class="field" style="margin-bottom:16px">Días disponibles${obChips('days',DAYS,true)}</label>
    <div class="grid g-2 gap-12">${obSelect('Sesiones por semana','sessions',['1','2','3','4','5','6'])}${obSelect('Lugar habitual','place',PLACES)}
    ${obSelect('Tiempo disponible','time',['20-30 min','30-45 min','45-60 min','60-90 min'])}${obInput('Preferencias','prefsAvail','text','Ej. mañanas')}</div>
    <label class="field" style="margin-top:12px">Equipamiento disponible${obChips('equipment',EQUIP,true)}</label>`;
  if(step===4) return `<div class="legal-note" style="margin-bottom:16px">${icon('shield')}<div>Esta información es <b>privada y sensible</b>. Se almacena de forma segura y solo se comparte con tu entrenador según tu configuración de privacidad.</div></div>
    <div class="grid g-2 gap-12">${obInput('Lesiones','injuries')}${obInput('Dolor actual','pain')}${obInput('Cirugías','surgery')}${obInput('Restricciones','restrictions')}
    ${obInput('Limitaciones de movimiento','movLimit')}${obInput('Condiciones médicas relevantes','conditions')}${obInput('Medicamentos relevantes','meds')}${obInput('Recomendaciones médicas','medRec')}</div>
    <label class="field" style="margin-top:12px">Ejercicios que debe evitar<textarea oninput="${OB('avoid')}=this.value">${esc(d.avoid)}</textarea></label>`;
  if(step===5) return `<div class="grid g-2 gap-12">${obInput('Ejercicios favoritos','fav')}${obInput('Ejercicios que no le gustan','hate')}
    ${obSelect('Preferencia de lugar','prefPlace',['Gimnasio','Casa','Exterior'])}${obSelect('Experiencia con máquinas','machExp',['Baja','Media','Alta'])}
    ${obSelect('Experiencia con pesas','weightExp',['Baja','Media','Alta'])}${obSelect('Intensidad preferida','intensity',['Baja','Media','Media-alta','Alta'])}</div>`;
  if(step===6){ const items=[['cTerms','Términos de uso'],['cPrivacy','Política de privacidad'],['cData','Tratamiento de datos'],['cPhysical','Consentimiento para almacenar información física'],['cRisks','Reconocimiento de riesgos'],['cShare','Compartir información con el entrenador'],['cMedia','Almacenar imágenes y videos']];
    return `<div class="legal-note" style="margin-bottom:16px">${icon('alert')}<div>Documentos de demostración. <b>Deben ser revisados por un profesional legal</b> antes de usar la plataforma comercialmente.</div></div>
    ${items.map(it=>`<label class="row spread surface" style="padding:12px 14px;margin-bottom:8px;cursor:pointer"><span>${it[1]}</span><span class="switch"><input type="checkbox" ${d[it[0]]?'checked':''} onchange="${OB(it[0])}=this.checked"><span class="slider"></span></span></label>`).join('')}
    <div class="priv-note" style="margin-top:8px">${icon('lock')}<div>Se guardará la fecha de aceptación, la versión del documento y el estado del consentimiento.</div></div>`;
  }
}
function obChipsUnit(){ const d=S.onboarding.data; return `<div class="row gap-6" style="margin-top:6px">${['kg','lb'].map(u=>`<button type="button" class="chip ${d.unit===u?'active':''}" onclick="${OB('unit')}='${u}';$('#obStep').innerHTML=onboardStep(0,S.onboarding.data)">${u==='kg'?'Kilogramos':'Libras'}</button>`).join('')}</div>`; }
function obNext(){ const o=S.onboarding; if(o.step===0&&!o.data.name.trim()){toast('Falta el nombre','','err');return;} o.step=clamp(o.step+1,0,6); renderView(); window.scrollTo({top:0}); }
function obPrev(){ S.onboarding.step=clamp(S.onboarding.step-1,0,6); renderView(); window.scrollTo({top:0}); }
function obFinish(){
  const d=S.onboarding.data;
  if(!(d.cTerms&&d.cPrivacy&&d.cData)){ toast('Consentimiento requerido','Acepta términos, privacidad y datos','err'); return; }
  const s=curStudent();
  s.name=(d.name+' '+d.lastname).trim(); s.email=d.email; s.phone=d.phone; s.birth=d.birth; s.country=d.country; s.unit=d.unit;
  s.height=+d.height; s.weight=+d.weight; s.targetWeight=d.targetWeight?+d.targetWeight:null; s.experience=d.experience; s.dominance=d.dominance;
  s.goal=d.goal; s.goalsSec=d.goalsSec; s.days=d.days.length?d.days:['Lun','Mié','Vie']; s.sessionsPerWeek=+d.sessions; s.gymPlace=d.place; s.equipment=d.equipment; s.timeAvail=d.time;
  s.injuries=d.injuries; s.pain=d.pain; s.conditions=d.conditions; s.meds=d.meds; s.avoid=d.avoid;
  s.prefs={favoritos:d.fav,odiados:d.hate,lugar:d.prefPlace,maquinas:d.machExp,pesas:d.weightExp,intensidad:d.intensity};
  s.consent={accepted:true,date:new Date().toISOString(),version:DB.meta.consentVersion,terms:d.cTerms,privacy:d.cPrivacy,datos:d.cData,fisica:d.cPhysical,riesgos:d.cRisks,compartir:d.cShare,media:d.cMedia};
  s.onboarded=true; saveDB(); S.onboarding=null;
  toast('¡Registro completado!','Tu entrenador ya puede diseñar tu plan');
  go('s-week');
}

/* =========================================================================
   18. INICIALIZACIÓN
========================================================================== */
function boot(){
  applyTheme();
  render();
  // Cierra panel notif al hacer clic fuera
  document.addEventListener('click',e=>{ if(S.notifOpen){ const p=$('#notifPanel'); const bell=e.target.closest('.ibtn'); if(p&&!p.contains(e.target)&&!bell){ S.notifOpen=false; p.classList.remove('open'); } } });
  console.log('%cTrain96','color:#4361ff;font-size:22px;font-weight:800','· prototipo cargado. Datos en LocalStorage.');
}
document.addEventListener('DOMContentLoaded',boot);











</script>
