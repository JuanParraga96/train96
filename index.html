<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Train96 — Acceso</title>
<style>
:root{
  --brand:#4361ff; --brand-2:#8b5cf6; --brand-grad:linear-gradient(135deg,var(--brand),var(--brand-2));
  --bg-1:#0b0f1c; --bg-2:#111627; --card:#141a2e; --card-2:#182140;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.14);
  --text:#f4f6fb; --muted:#9aa6c2; --muted-2:#66718e;
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.7);
  --ease:cubic-bezier(.4,.14,.3,1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
  font-family:var(--font);color:var(--text);min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb,var(--brand) 14%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 20%, color-mix(in srgb,var(--brand-2) 12%, transparent), transparent 55%),
    var(--bg-1);
  display:flex;align-items:center;justify-content:center;padding:22px;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
svg{width:20px;height:20px;flex:none}
.wrap{width:100%;max-width:440px;animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px}
.logo{width:60px;height:60px;border-radius:16px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#fff;box-shadow:0 10px 30px -8px color-mix(in srgb,var(--brand) 60%,transparent);margin-bottom:14px}
.brand h1{font-size:30px;letter-spacing:-.02em}
.brand p{color:var(--muted);margin-top:8px;font-size:14.5px;max-width:340px}
.card{background:linear-gradient(180deg,var(--card),var(--bg-2));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow-lg)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:700;margin:0 4px 10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px;border-radius:16px;background:var(--bg-2);border:1.5px solid var(--line-strong);text-align:left;transition:.18s var(--ease);margin-bottom:10px}
.opt:hover{background:var(--card-2);transform:translateY(-2px);border-color:var(--brand)}
.opt:last-child{margin-bottom:0}
.opt .ic{width:46px;height:46px;border-radius:13px;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.opt .ic.soft{background:var(--card-2);color:var(--brand)}
.opt .tx{flex:1;min-width:0}
.opt .tt{display:block;font-weight:700;font-size:15.5px}
.opt .sb{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.opt .chev{color:var(--muted-2)}
.sub{overflow:hidden;max-height:0;transition:max-height .35s var(--ease),opacity .3s;opacity:0}
.sub.open{max-height:220px;opacity:1;margin-top:6px}
.sub-inner{padding-top:6px;border-top:1px dashed var(--line);margin-top:6px}
.sub .opt{animation:slide .3s var(--ease)}
.ilabel{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 2px 8px}
.iinput{width:100%;padding:14px;border-radius:14px;background:var(--bg-2);border:1.5px solid var(--line-strong);color:var(--text);font-size:16px;text-transform:none}
.iinput:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.ierr{color:#ff9a9a;font-size:12.5px;font-weight:600;margin:8px 2px 0}
.cta{width:100%;margin-top:14px;padding:14px;border-radius:14px;font-weight:700;font-size:15px;color:#fff;background:var(--brand-grad);box-shadow:0 8px 22px -10px color-mix(in srgb,var(--brand) 70%,transparent)}
.cta:hover{transform:translateY(-1px)}
.hintnote{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted-2);font-size:12px;margin-top:14px}
.hintnote svg{width:14px;height:14px}
.note{text-align:center;color:var(--muted-2);font-size:12.5px;margin-top:18px;display:flex;align-items:center;gap:7px;justify-content:center}
.note svg{width:14px;height:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;margin:2px 4px 12px;padding:6px 4px}
.back:hover{color:var(--text)}
.back svg{width:16px;height:16px}
@media(max-width:520px){ .brand h1{font-size:26px} .card{padding:18px} }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <div class="logo">96</div>
    <h1>Train96</h1>
    <p>Plataforma de entrenamiento personal. Elige cómo quieres acceder.</p>
  </div>

  <div class="card">
    <!-- Vista principal: elegir tipo de acceso -->
    <div id="mainView">
      <div class="lbl">Acceder como</div>
      <button class="opt" onclick="location.href='app.html?goto=trainer'" aria-label="Entrar como entrenador">
        <span class="ic">${T_DUMBBELL}</span>
        <span class="tx"><span class="tt">Entrenador</span><span class="sb">Administra alumnos, rutinas y progreso</span></span>
        <span class="chev">${T_CHEV}</span>
      </button>
      <button class="opt" onclick="location.href='app.html?goto=assistant'" aria-label="Entrar como ayudante">
        <span class="ic">${T_USERS}</span>
        <span class="tx"><span class="tt">Ayudante</span><span class="sb">Colabora con permisos asignados</span></span>
        <span class="chev">${T_CHEV}</span>
      </button>
      <button class="opt" onclick="showUser()" aria-label="Acceder como usuario">
        <span class="ic soft">${T_USER}</span>
        <span class="tx"><span class="tt">Usuario</span><span class="sb">Entrena y sigue tu progreso</span></span>
        <span class="chev">${T_CHEV}</span>
      </button>
    </div>

    <!-- Sub-vista de usuario -->
    <div id="userView" style="display:none">
      <button class="back" onclick="showMain()">${T_BACK} Volver</button>
      <div class="lbl">Usuario</div>
      <button class="opt" onclick="location.href='app.html?goto=student'" aria-label="Iniciar sesión">
        <span class="ic">${T_LOGIN}</span>
        <span class="tx"><span class="tt">Iniciar sesión</span><span class="sb">Ya tengo una cuenta con mi entrenador</span></span>
        <span class="chev">${T_CHEV}</span>
      </button>
      <button class="opt" onclick="showInvite()" aria-label="Tengo una invitación">
        <span class="ic soft">${T_TICKET}</span>
        <span class="tx"><span class="tt">Tengo una invitación</span><span class="sb">Ingresa tu código o enlace</span></span>
        <span class="chev">${T_CHEV}</span>
      </button>
    </div>

    <!-- Sub-vista de invitación -->
    <div id="inviteView" style="display:none">
      <button class="back" onclick="showUser()">${T_BACK} Volver</button>
      <div class="lbl">Tu invitación</div>
      <label class="ilabel">Código o enlace</label>
      <input id="inviteInput" class="iinput" placeholder="Ej. AB12CD  ·  o pega el enlace" autocomplete="off">
      <div id="inviteErr" class="ierr" role="alert" style="display:none"></div>
      <button class="cta" onclick="submitInvite()">Continuar</button>
      <div class="hintnote">${T_INFO} Necesitas una invitación de tu entrenador.</div>
      <button class="opt" style="margin-top:14px" onclick="location.href='app.html?goto=demo'" aria-label="Probar registro demo">
        <span class="ic soft">${T_PLUS}</span>
        <span class="tx"><span class="tt">Probar registro demo</span><span class="sb">Modo demostración, sin datos reales</span></span>
        <span class="chev">${T_CHEV}</span>
      </button>
    </div>
  </div>

  <div class="note">${T_SHIELD} Modo demostración · no usar con datos reales</div>
</main>

<script>
// Iconos SVG (trazo)
const IC={
  dumbbell:'M6.5 6.5l11 11 M21 21l-1-1 M3 3l1 1 M18 22l4-4 M2 6l4-4 M6.5 6.5L2 11l4 4 4.5-4.5 M17.5 17.5L22 13l-4-4-4.5 4.5',
  users:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75',
  user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  chev:'M9 18l6-6-6-6',
  back:'M15 18l-6-6 6-6',
  login:'M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4 M10 17l5-5-5-5 M15 12H3',
  plus:'M12 5v14 M5 12h14',
  shield:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
  ticket:'M3 7v3a2 2 0 0 1 0 4v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3a2 2 0 0 1 0-4V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z M13 5v2 M13 17v2 M13 11v2',
  info:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 16v-4 M12 8h.01',
};
function svg(name){const p=IC[name];return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p.split(' M').map((s,i)=>'<path d="'+(i?'M'+s:s)+'"/>').join('')+'</svg>';}
// Reemplaza los marcadores de icono en el HTML
document.body.innerHTML=document.body.innerHTML
  .replace(/\$\{T_DUMBBELL\}/g,svg('dumbbell')).replace(/\$\{T_USERS\}/g,svg('users'))
  .replace(/\$\{T_USER\}/g,svg('user')).replace(/\$\{T_CHEV\}/g,svg('chev')).replace(/\$\{T_BACK\}/g,svg('back'))
  .replace(/\$\{T_LOGIN\}/g,svg('login')).replace(/\$\{T_PLUS\}/g,svg('plus')).replace(/\$\{T_SHIELD\}/g,svg('shield'))
  .replace(/\$\{T_TICKET\}/g,svg('ticket')).replace(/\$\{T_INFO\}/g,svg('info'));
function hideAll(){ ['mainView','userView','inviteView'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';}); }
function showUser(){ hideAll(); document.getElementById('userView').style.display='block'; }
function showMain(){ hideAll(); document.getElementById('mainView').style.display='block'; }
function showInvite(){ hideAll(); document.getElementById('inviteView').style.display='block'; setTimeout(()=>{const i=document.getElementById('inviteInput');if(i)i.focus();},50); }
function submitInvite(){
  const raw=(document.getElementById('inviteInput').value||'').trim();
  const err=document.getElementById('inviteErr');
  const fail=(m)=>{ err.textContent=m; err.style.display='block'; };
  if(!raw){ fail('Ingresa tu código o enlace.'); return; }
  let token=null;
  const mt=raw.match(/[?&]invite=([^&\s]+)/); if(mt) token=decodeURIComponent(mt[1]);
  if(!token){
    // buscar por código en la base de datos del prototipo (mismo LocalStorage)
    try{ const db=JSON.parse(localStorage.getItem('train96_db_v1')||'null');
      if(db&&db.invitations){ const code=raw.toUpperCase().replace(/\s/g,'');
        const inv=db.invitations.find(i=>i.code===code); if(inv){ if(['completed','cancelled','expired'].includes(inv.status)){ fail('Esta invitación ya no está disponible.'); return; } token=inv.token; } }
    }catch(e){}
  }
  if(!token){ fail('No encontramos esa invitación. Revisa el código o el enlace.'); return; }
  location.href='app.html?invite='+encodeURIComponent(token);
}
</script>
</body>
</html>
