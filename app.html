    <div class="measure-val" style="font-size:30px;margin:6px 0" id="wVal">${wDisp}</div>
    <input type="range" class="quiz-range" min="30" max="200" value="${a.weight||70}" oninput="quizPhys('weight',this.value)">
    ${a.weight!=null?`<button class="btn ghost sm" style="margin-top:8px" onclick="A().weight=null;renderQuizBody()">Borrar</button>`:''}

}
function stepErr(id){ const e=S.quiz._error; return (e&&e.stepId===id)?`<div class="err-msg" role="alert" style="margin-top:10px">${esc(e.msg)}</div>`:''; }

/* ---- Shell y navegación ---- */
function viewQuiz(){ const t=DB.trainers.find(x=>x.id===S.quiz.trainerId)||curTrainer(); applyThemeColors(t.brand.brandColor,t.brand.brandColor2);
  const step=curStep();
  if(!step)return quizProcessing();
  if(step.id==='__processing')return quizShell(quizProcessing(),false,step);
  if(step.id==='__result')return quizShell(quizResult(),false,step);
  return quizShell(step.render(),step.id!=='welcome',step);
}
function quizSteps(){ return STEPS.filter(s=>!s.cond||s.cond(S.quiz)); }
function curStep(){ if(S.quiz.stage==='processing')return{id:'__processing'}; if(S.quiz.stage==='result')return{id:'__result'}; const steps=quizSteps(); return steps.find(s=>s.id===S.quiz.currentStepId)||steps[0]; }
function quizPct(){ const steps=quizSteps(); const qs=steps.filter(s=>s.q); const ci=steps.findIndex(s=>s.id===S.quiz.currentStepId); if(ci<0)return 0; const done=steps.slice(0,ci+1).filter(s=>s.q).length; if(!qs.length)return 0; return clamp(Math.round(done/qs.length*100), done>0?4:0, 100); }
function quizShell(inner,showProgress,step){ const pct=showProgress?quizPct():0; const chap=step&&step.chapter?step.chapter:'';
  // Toda pregunta principal lleva botón Continuar; nunca se avanza automáticamente.
  const needCTA = step && step.q;
  const ready = needCTA ? stepReady(step) : true;
  return `<div class="quiz-wrap">
    <div class="quiz-top">
      <button class="ibtn" onclick="quizBack()" aria-label="Atrás" ${step&&step.id==='welcome'?'style="visibility:hidden"':''}>${icon('chevL')}</button>
      ${showProgress?`<div class="quiz-progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>`:'<div class="grow"></div>'}
      <button class="ibtn" onclick="quizExit()" aria-label="Guardar y salir">${icon('x')}</button>
    </div>
    ${showProgress&&chap?`<div class="quiz-count" aria-live="polite">${esc(chap)} · ${pct}%</div>`:''}
    <div class="quiz-body" id="quizBody">${inner}
      ${needCTA?`<button class="btn primary block quiz-cta" style="margin-top:20px" ${ready?'':'disabled aria-disabled="true"'} onclick="quizNext()">Continuar ${icon('chevR')}</button>`:''}
    </div>
  </div>`;
}
/* Determina si una pregunta de selección tiene respuesta suficiente para habilitar Continuar (sin efectos secundarios) */
function stepReady(step){ const a=A();
  switch(step.id){
    case 'goal': return !!a.primaryGoal;
    case 'secondaryGoals': return (a.secondaryGoals||[]).length>0;
    case 'experience': return !!a.experienceLevel;
    case 'availability': return (a.availableDays||[]).length>0;
    case 'duration': return !!a.sessionDuration;
    case 'location': return !!a.primaryLocation;
    case 'equipment': return a.primaryLocation==='Gimnasio'?!!a.equipment_single:(a.equipment||[]).length>0;
    case 'weightgoal': return !!a.weightGoalDirection;
    case 'obstacle': return !!a.mainObstacle;
    case 'coaching': return !!a.coachingStyle;
    case 'startTiming': return !!a.startTiming;
    default: return true; // identidad, físico (opcional) y molestias: habilitado, se valida al continuar
  }
}
function renderQuizBody(){ $('#app').innerHTML=viewQuiz(); }
function quizPick(key,val){ A()[key]=val; S.quiz._error=null; QuizService.touch(); renderQuizBody(); }
function quizPickMulti(key,val,max){ const a=A()[key]||[]; const i=a.indexOf(val); if(i>=0)a.splice(i,1); else{ if(a.length>=max){ return; } a.push(val);} A()[key]=a; QuizService.touch(); renderQuizBody(); }
function quizSetBirth(v){ ID().birthDate=v; S.quiz._error=null; QuizService.touch(); renderQuizBody(); }
function quizToggleDay(d){ const a=A().availableDays||[]; const i=a.indexOf(d); if(i>=0)a.splice(i,1); else a.push(d); A().availableDays=a; if(A().desiredSessions)A().desiredSessions=clamp(A().desiredSessions,1,Math.max(1,a.length||1)); QuizService.touch(); renderQuizBody(); }
function quizSetSessions(n){ const max=Math.max(1,(A().availableDays||[]).length||1); A().desiredSessions=clamp(n,1,max); QuizService.touch(); renderQuizBody(); }
function quizPhys(key,val){ A()[key]=+val; const id=key==='height'?'hVal':'wVal'; const el=document.getElementById(id); if(el){ const u=key==='height'?(A().heightUnit||'cm'):(A().weightUnit||'kg'); el.textContent = key==='height'?(u==='ft'?cmToFt(val):val+' cm'):(u==='lb'?Math.round(val*2.2046)+' lb':val+' kg'); } QuizService.touch(); }
function quizSkipPhysical(){ A().height=null; A().weight=null; quizNext(); }
function quizNext(){ const step=curStep(); if(step.validate){ const v=step.validate(S.quiz); if(!v.ok){ S.quiz._error={stepId:step.id,msg:v.msg}; renderQuizBody(); if(v.focus){ const el=$(v.focus); if(el){el.classList.add('invalid');el.focus();} } return; } }
  S.quiz._error=null; const steps=quizSteps(); const ci=steps.findIndex(s=>s.id===step.id); const nxt=steps[ci+1];
  if(nxt){ S.quiz.navigationHistory.push(step.id); if(!S.quiz.visitedStepIds.includes(step.id))S.quiz.visitedStepIds.push(step.id); S.quiz.currentStepId=nxt.id; S.quiz.status='in-progress'; QuizService.touch(); renderQuizBody(); window.scrollTo(0,0); }
  else quizToProcessing(); }
function quizBack(){ const h=S.quiz.navigationHistory; if(h.length){ S.quiz.currentStepId=h.pop(); S.quiz._error=null; QuizService.touch(); renderQuizBody(); } else quizExit(); }
function quizExit(){ QuizService.touch(); S.role='student-invited'; S.view='quizPaused'; saveState(); render(); }
function quizPausedView(){ return `<div class="login-screen"><div class="login-card center" style="flex-direction:column;text-align:center">
  <div class="ni-ico txt-info" style="width:56px;height:56px;margin-bottom:14px">${icon('clipboard')}</div>
  <h2 style="margin-bottom:8px">Tu avance quedó guardado</h2><p class="muted" style="margin-bottom:20px">Puedes continuar el cuestionario donde lo dejaste.</p>
  <button class="btn primary block" onclick="S.view='quiz';render()">Continuar ${icon('chevR')}</button>
  <button class="btn ghost block" style="margin-top:10px" onclick="exitInvite()">Salir</button></div></div>`; }
function exitInvite(){ history.replaceState(null,'',location.pathname); S.role='trainer'; S.inviteToken=null; S.authed=false; saveState(); location.href='index.html'; }

/* ---- Procesamiento + resultado ---- */
let PROC_TIMER=null;
function quizToProcessing(){ S.quiz.stage='processing'; QuizService.touch(); renderQuizBody();
  const t=DB.trainers.find(x=>x.id===S.quiz.trainerId); const tn=t?t.name:'tu entrenador';
  const msgs=['Organizando tu objetivo','Preparando tu disponibilidad','Revisando lo que debemos cuidar','Creando tu perfil para '+tn];
  let i=0; const set=()=>{ const el=$('#procMsg'); if(el)el.textContent=msgs[Math.min(i,msgs.length-1)]; i++; };
  set(); if(PROC_TIMER)clearInterval(PROC_TIMER); PROC_TIMER=setInterval(set,800);
  setTimeout(()=>{ clearInterval(PROC_TIMER); QuizService.complete(); S.quiz.stage='result'; QuizService.touch(); renderQuizBody(); },2600);
}
function quizProcessing(){ return `<div class="quiz-processing"><div class="proc-ring">${ring(72,{size:120,label:'',color:'var(--brand)'})}</div>
  <h2 id="procMsg" aria-live="polite">Organizando tu objetivo</h2><p class="muted tiny">Un momento…</p></div>`; }
function quizResult(){ const a=A(),id=ID(); const t=DB.trainers.find(x=>x.id===S.quiz.trainerId)||curTrainer();
  const hDisp = a.height!=null?(a.heightUnit==='ft'?cmToFt(a.height):a.height+' cm'):'No proporcionado';
  const wDisp = a.weight!=null?(a.weightUnit==='lb'?Math.round(a.weight*2.2046)+' lb':a.weight+' kg'):'No proporcionado';
  const limit = a.hasLimitation==='Sí'?(a.limitationComment||'Tiene una limitación reportada'):'No reportada';
  const rows=[['Objetivo principal',a.primaryGoal],['Objetivos secundarios',(a.secondaryGoals||[]).join(', ')],['Situación actual',a.experienceLevel],['Disponibilidad seleccionada',(a.availableDays||[]).map(d=>DAYS_MAP_SHORT[d]).join(', ')+' · '+(a.desiredSessions||'—')+' sesiones'],['Duración',a.sessionDuration||'—'],['Lugar',a.primaryLocation||'—'],['Equipo',(a.equipment||[]).join(', ')||'—'],['Altura',hDisp],['Peso',wDisp],['Molestia o limitación',limit],['Obstáculo principal',a.mainObstacle||'—'],['Estilo de acompañamiento',a.coachingStyle||'—'],['Inicio deseado',a.startTiming||'—']];
  return `<div class="view-enter">
    <div class="quiz-center" style="margin-bottom:8px">
      <div class="ni-ico txt-ok" style="width:60px;height:60px;margin:0 auto 12px">${icon('check')}</div>
      <div class="tiny muted" style="text-transform:uppercase;letter-spacing:.1em">Tu punto de partida está listo</div>
      <h1 style="font-size:26px;margin:6px 0">${esc(id.firstName||'')}</h1>
    </div>
    <div class="card pad" style="margin:16px 0">${rows.map(r=>kv(r[0],esc(String(r[1]||'—')))).join('')}</div>
    <div class="priv-note" style="margin-bottom:18px">${icon('info')}<div>Esto todavía no es tu rutina. ${esc(t.name)} revisará tus respuestas antes de preparar la planificación.</div></div>
    <button class="btn primary block quiz-cta" onclick="quizSend()">${icon('send')} Enviar a mi entrenador</button>
    <button class="btn ghost block" style="margin-top:10px" onclick="S.quiz.stage=null;S.quiz.currentStepId='name';S.quiz.navigationHistory=[];renderQuizBody()">Revisar respuestas</button>
  </div>`;
}
function quizSend(){ const sid=S.quiz.studentId; if(!sid){ toast('Error','No se pudo crear el perfil','err'); return; }
  toast('Perfil enviado','Tu entrenador revisará tu información');
  S.role='student'; S.studentId=sid; S.authed=true; S.inviteToken=null; S.view='s-week'; history.replaceState(null,'',location.pathname); saveState(); render(); }

/* ---- Perfil a partir de la sesión ---- */
function buildProfile(sess){ const a=sess.answers,id=sess.identity;
  return { firstName:id.firstName,lastName:id.lastName,name:((id.firstName||'')+' '+(id.lastName||'')).trim(),
    email:(id.email||'').toLowerCase(), phone: id.phoneNumber?((id.phoneCountryCode||'')+' '+id.phoneNumber):'',
    phoneCountryCode:id.phoneCountryCode||'', phoneNumber:id.phoneNumber||'', birthDate:id.birthDate||'',
    goal:a.primaryGoal||'', goalsSec:a.secondaryGoals||[], experience:mapLevel(a.experienceLevel),
    height:a.height, weight:a.weight, heightUnit:a.heightUnit||'cm', weightUnit:a.weightUnit||'kg',
    weightGoalDirection:a.weightGoalDirection||'', targetWeight:a.targetWeight!=null?a.targetWeight:null,
    days:(a.availableDays||[]).map(d=>DAYS_MAP_SHORT[d]||d), sessions:a.desiredSessions||null,
    places:a.primaryLocation?[a.primaryLocation]:[], equipment:a.equipment||[], duration:a.sessionDuration||'',
    hasLimitation:a.hasLimitation==='Sí', limitationComment:a.hasLimitation==='Sí'?(a.limitationComment||''):'',
    obstacle:a.mainObstacle||'', coaching:a.coachingStyle||'', startTiming:a.startTiming||'', desiredStartDate:a.desiredStartDate||null,
    trainPrefs:[], profileType:profileFor(a) };
}
function mapLevel(l){ return ({'Estoy comenzando':'Principiante','Estoy regresando tras una pausa':'Principiante','Entreno de vez en cuando':'Principiante','Entreno de forma constante':'Intermedio','Tengo experiencia avanzada':'Avanzado'})[l]||'Principiante'; }
function profileFor(a){ if(a.primaryGoal==='Aumentar fuerza')return 'Enfoque de fuerza'; if(a.primaryGoal==='Ganar masa muscular')return 'Constructor constante'; if(a.primaryGoal==='Rendimiento deportivo')return 'Rendimiento activo'; if(a.primaryGoal==='Mejorar movilidad'||a.primaryGoal==='Mantenerme activo')return 'Movimiento y bienestar'; if(a.experienceLevel==='Estoy regresando tras una pausa'||a.primaryGoal==='Volver a entrenar')return 'Reinicio progresivo'; return 'Transformación estructurada'; }
function applyThemeColors(c1,c2){ document.documentElement.style.setProperty('--brand',c1); document.documentElement.style.setProperty('--brand-2',c2); }

/* ---- QuizService (idempotente) ---- */
const QuizService={
  start(inv){ let sess=DB.quizSessions.find(q=>q.token===inv.token);
    if(!sess){ sess=freshQuizSession(inv); DB.quizSessions.push(sess); }
    S.quiz=sess; if(sess.status==='not-started'){ sess.status='in-progress'; sess.startedAt=new Date().toISOString(); }
    InvitationService.markInProgress(inv); StorageService.save(); return sess; },
  touch(){ if(S.quiz){ S.quiz.updatedAt=new Date().toISOString(); StorageService.save(); } },
  complete(){ const sess=S.quiz; if(sess.status==='completed'&&sess.studentId){ return DB.students.find(s=>s.id===sess.studentId); }
    const inv=InvitationService.find(sess.token); const prof=buildProfile(sess);
    const student=StudentService.createProvisional(inv,sess,prof);
    sess.status='completed'; sess.completedAt=new Date().toISOString(); sess.studentId=student.id;
    InvitationService.complete(inv,student.id); StorageService.save(); return student; },
};
function freshQuizSession(inv){ return { id:uid('qs'), inviteId:inv.id, token:inv.token, trainerId:inv.trainer, status:'not-started',
  currentStepId:'welcome', visitedStepIds:[], navigationHistory:[], stage:null, startedAt:null, updatedAt:null, completedAt:null, studentId:null,
  identity:{firstName:inv.name||'',lastName:'',birthDate:'',email:inv.email||'',phoneCountryCode:'+57',phoneNumber:'',phoneFull:''},
  answers:{primaryGoal:'',secondaryGoals:[],experienceLevel:'',currentWeeklyFrequency:null,availableDays:[],desiredSessions:null,sessionDuration:'',preferredTime:'',primaryLocation:'',equipment:[],equipment_single:'',height:null,heightUnit:'cm',weight:null,weightUnit:'kg',weightGoalDirection:'',targetWeight:null,hasLimitation:null,limitationComment:'',mainObstacle:'',coachingStyle:'',startTiming:'',desiredStartDate:null,challengeType:''},
  consent:null,
  _error:null }; }
function quizInvalidView(){ const k=S.invitedView; const map={notfound:['Este enlace no corresponde a una invitación válida.','search'],expired:['Esta invitación venció. Solicita una nueva a tu entrenador.','clock'],cancelled:['Esta invitación fue cancelada.','x'],completed:['Este registro ya fue completado.','check']};
  const m=map[k]||map.notfound; return `<div class="login-screen"><div class="login-card center" style="flex-direction:column;text-align:center">
  <div class="ni-ico txt-warn" style="width:56px;height:56px;margin-bottom:14px">${icon(m[1])}</div>
  <h2 style="margin-bottom:8px">Invitación no disponible</h2><p class="muted" style="margin-bottom:20px">${m[0]}</p>
  <button class="btn primary block" onclick="location.href='index.html'">${icon('chevL')} Volver al acceso</button></div></div>`; }

/* =========================================================================
   18. INICIALIZACIÓN
========================================================================== */
function boot(){
  // Detección de enlace de invitación ?invite=TOKEN
  const params=new URLSearchParams(location.search);
  const token=params.get('invite');
  if(token){ openAsInvited(token); attachGlobal(); return; }
  // Entrada desde la página de acceso (index.html) mediante ?goto=
  const goto=params.get('goto');
  if(goto){
    history.replaceState(null,'',location.pathname);
    if(goto==='demo'||goto==='newuser'){ startNewDemoRegistration(); attachGlobal(); return; }
    if(['trainer','assistant','student'].includes(goto)){ demoLogin(goto); attachGlobal(); return; }
  }
  // Reanudar quiz en curso si el estado quedó en modo invitado
  if(S.role==='student-invited'){ const sess=DB.quizSessions.find(q=>q.token===S.inviteToken); if(sess){ S.quiz=sess; } else { S.role='trainer'; S.view='dashboard'; } }
  applyTheme();
  render();
  attachGlobal();
  console.log('%cTrain96','color:#4361ff;font-size:22px;font-weight:800','· prototipo v1.1 cargado. Datos en LocalStorage.');
}
function attachGlobal(){
  document.addEventListener('click',e=>{ if(S.notifOpen){ const p=$('#notifPanel'); const bell=e.target.closest('.ibtn'); if(p&&!p.contains(e.target)&&!bell){ S.notifOpen=false; p.classList.remove('open'); } } });
}
document.addEventListener('DOMContentLoaded',boot);
